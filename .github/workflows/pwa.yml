name: PWA build and offline checks

on:
  push:
    branches: [feat/pwa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Prepare local fonts and SQLite worker
        run: bash tool/prepare_assets.sh
      - name: Tests for existing Android logic and web repository
        run: flutter test
      - name: Check Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build PWA
        run: |
          flutter build web --release --pwa-strategy=none --no-web-resources-cdn
          python3 tool/build_service_worker.py
      - name: Install browser test tools
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Record resolved dependencies
        run: python3 tool/report_dependencies.py
      - name: Exercise persistence and reopening offline
        run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-test-results-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: vertice-pwa-${{ github.run_number }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolved-lockfiles-${{ github.run_number }}
          path: |
            pubspec.lock
            package-lock.json
          if-no-files-found: ignore
          retention-days: 7
