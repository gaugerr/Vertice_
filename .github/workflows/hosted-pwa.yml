name: Verify hosted PWA

on:
  push:
    branches: [feat/pwa]
    paths: [.github/workflows/hosted-pwa.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERTICE_TEST_URL: https://vertice-gamma-khaki.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Wait for the published PWA and check hosting headers
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const base = process.env.VERTICE_TEST_URL;
          (async () => {
            let ready = false;
            for (let attempt = 0; attempt < 60; attempt++) {
              try {
                const r = await fetch(base + '/online.txt?check=' + Date.now(), {signal: AbortSignal.timeout(10000)});
                if (r.ok && (await r.text()).trim() === 'vertice-online-v1') { ready = true; break; }
                console.log('Waiting for PWA, HTTP', r.status);
              } catch (error) { console.log(error.message); }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            assert(ready, 'Published PWA did not become publicly available');
            const r = await fetch(base);
            assert.equal(r.status, 200);
            assert.equal(r.headers.get('cross-origin-opener-policy'), 'same-origin');
            assert.equal(r.headers.get('cross-origin-embedder-policy'), 'require-corp');
            const wasm = await fetch(base + '/sqlite3.wasm', {method: 'HEAD'});
            assert.equal(wasm.status, 200);
            assert.match(wasm.headers.get('content-type'), /application\/wasm/);
            const manifest = await fetch(base + '/manifest.json').then(r => r.json());
            assert.equal(manifest.display, 'standalone');
            const sw = await fetch(base + '/service-worker.js');
            assert.equal(sw.status, 200);
            assert.match(sw.headers.get('cache-control'), /no-store/);
            console.log('Public HTTPS, COOP/COEP, WASM, manifest and service worker verified');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Install browser checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check offline persistence against the hosted app
        run: |
          cat > playwright.hosted.config.js <<'JS'
          const config = require('./playwright.config');
          delete config.webServer;
          config.use.baseURL = process.env.VERTICE_TEST_URL;
          module.exports = config;
          JS
          npx playwright test --config playwright.hosted.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-pwa-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
